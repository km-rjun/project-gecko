[package]
name = "gateway"
description = "Remote access gateway: HTTP API, workspace socket, vault, protocol multiplexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vault.workspace = true
protocol-core.workspace = true
edge-proto.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
governor = "0.10"
uuid = { version = "1.29", features = ["v7"] }
base64 = "0.22"
sha2 = "0.11"
subtle = "2.6"
hex = "0.4"
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["process", "fs"] }

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
tempfile = "3"

[build-dependencies]
toml = "1"
serde = { workspace = true }

[lints]
workspace = true
