# cargo-deny: dependency licence, advisory and source policy.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `rsa` (via russh): non-constant-time private-key operations, no fixed release. The gateway
    # never performs RSA private-key operations: RSA user keys are rejected (decision D-044);
    # RSA host-key verification uses only the public key. Revisit when a fixed `rsa` ships.
    { id = "RUSTSEC-2023-0071", reason = "RSA private keys rejected; only public-key RSA operations are used (D-044)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
# All compatible with AGPL-3.0-only.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
